[workspace]
members = ["crates/protocol", "crates/core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
jsonschema = { version = "=0.60.2", default-features = false }
hmac = "=0.12.1"
sha2 = "=0.10.9"
uuid = { version = "=1.26.0", features = ["v4", "v5"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time", "net", "io-util", "macros"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Memory"] }
