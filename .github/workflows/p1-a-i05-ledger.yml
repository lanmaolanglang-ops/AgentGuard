name: P1-A I05 synthetic ledger
on:
  push:
    branches: ['p1-a/i05-ledger']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ledger:
    runs-on: windows-2022
    timeout-minutes: 18
    env:
      RUSTUP_TOOLCHAIN: '1.97.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.6'
      - name: Fixed Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - name: Verify static SQLite and execute I05 ATs
        run: python -B tools/verify_i05_ledger.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i05-ledger-synthetic-evidence
          path: .work/i05-ledger
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
