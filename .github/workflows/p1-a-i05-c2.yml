name: P1-A I05 C2 SQLite probe
on:
  push:
    branches: ['p1-a/i05-c2']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sqlite-probe:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.97.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.6'
      - name: Fixed Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - name: Rebuild and observe disposable SQLite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .work/i05-c2 | Out-Null
          python -B probes/i05-c2/run.py | Tee-Object -FilePath .work/i05-c2/observations.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rustfmt
        run: cargo fmt --manifest-path probes/i05-c2/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path probes/i05-c2/Cargo.toml --locked --offline --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i05-c2-synthetic-observations
          path: .work/i05-c2/observations.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
