name: P1-A I04 synthetic policy
on:
  push:
    branches: ['p1-a/i04-synthetic']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-policy:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fixed Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - name: Rustfmt
        run: cargo +1.97.1 fmt --manifest-path crates/policy/Cargo.toml -- --check
      - name: Clippy
        run: cargo +1.97.1 clippy --manifest-path crates/policy/Cargo.toml --locked --all-targets -- -D warnings
      - name: Synthetic AT classification
        run: cargo +1.97.1 test --manifest-path crates/policy/Cargo.toml --locked
