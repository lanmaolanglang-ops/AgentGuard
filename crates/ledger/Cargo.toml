[workspace]
resolver = "3"

[package]
name = "agentguard-synthetic-ledger"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
agentguard-protocol = { path = "../protocol" }
agentguard-typed-authorization = { path = "../typed-authorization" }
serde_json = "=1.0.151"
libsqlite3-sys = { version = "=0.39.1", default-features = false }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "backup"] }
sha2 = "=0.10.9"
uuid = { version = "=1.26.0", default-features = false, features = ["v4"] }
